spring.application.name=skyline-living-backend
spring.profiles.active=local

# SQL Server database connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SkylineLivingDB_Test;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:skyline_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application port
server.port=8080

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

file.upload-dir=uploads